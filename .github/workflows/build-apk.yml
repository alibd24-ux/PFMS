name: Build HisabPro Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK (Capacitor + Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Smart Project Detector (Unzip Any Archive, Subfolder, or Single TSX)
        run: |
          echo "=== Files currently in repository ==="
          ls -la

          ZIP_FILE=$(find . -maxdepth 3 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP archive: $ZIP_FILE — extracting..."
            unzip -o "$ZIP_FILE" -d ./_extracted_zip
            PKG_FROM_ZIP=$(find ./_extracted_zip -name "package.json" | head -n 1)
            if [ -n "$PKG_FROM_ZIP" ]; then
              SRC_DIR=$(dirname "$PKG_FROM_ZIP")
              cp -r "$SRC_DIR"/. .
            fi
            rm -rf ./_extracted_zip
          fi

          if [ ! -f "package.json" ]; then
            SUB_PKG=$(find . -maxdepth 4 -name "package.json" -not -path "./node_modules/*" | head -n 1)
            if [ -n "$SUB_PKG" ]; then
              SUB_DIR=$(dirname "$SUB_PKG")
              echo "Found package.json inside $SUB_DIR — copying to root..."
              cp -r "$SUB_DIR"/. .
            fi
          fi

          if [ ! -f "package.json" ]; then
            TSX_FILE=$(find . -maxdepth 3 -name "*.tsx" | head -n 1)
            if [ -n "$TSX_FILE" ]; then
              echo "Found single TSX file ($TSX_FILE) — auto-generating project structure..."
              mkdir -p src
              cp "$TSX_FILE" src/App.tsx
              cat << 'EOF' > package.json
          {
            "name": "hisabpro-takaflow-finance",
            "version": "2.1.0",
            "private": true,
            "scripts": {
              "dev": "vite",
              "build": "vite build"
            },
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/core": "^6.1.2",
              "lucide-react": "^0.454.0",
              "react": "^18.3.1",
              "react-dom": "^18.3.1",
              "recharts": "^2.13.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.2",
              "@types/react": "^18.3.12",
              "@types/react-dom": "^18.3.1",
              "@vitejs/plugin-react": "^4.3.3",
              "autoprefixer": "^10.4.20",
              "postcss": "^8.4.47",
              "tailwindcss": "^3.4.15",
              "typescript": "^5.6.3",
              "vite": "^5.4.10"
            }
          }
          EOF
              cat << 'EOF' > vite.config.ts
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          export default defineConfig({
            plugins: [react()],
            base: './',
            build: { outDir: 'dist', emptyOutDir: true }
          });
          EOF
              cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>HisabPro</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          EOF
              cat << 'EOF' > src/main.tsx
          import React from 'react';
          import ReactDOM from 'react-dom/client';
          import App from './App';
          import './index.css';
          ReactDOM.createRoot(document.getElementById('root') as HTMLElement).render(
            <React.StrictMode><App /></React.StrictMode>
          );
          EOF
              cat << 'EOF' > src/index.css
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          EOF
              cat << 'EOF' > tailwind.config.js
          export default {
            darkMode: 'class',
            content: ['./index.html', './src/**/*.{js,ts,jsx,tsx}'],
            theme: { extend: {} },
            plugins: [],
          };
          EOF
              cat << 'EOF' > postcss.config.js
          export default { plugins: { tailwindcss: {}, autoprefixer: {} } };
          EOF
              cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.hisabpro.takaflow.finance",
            "appName": "HisabPro",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
            fi
          fi

          if [ ! -f "package.json" ]; then
            echo "ERROR: রিপোজিটরিতে এখনো কোনো .zip বা .tsx ফাইল আপলোড হয়নি!"
            exit 1
          fi
          ls -la

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 5. Install Dependencies & Build Web Bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 6. Initialize & Sync Capacitor Android Platform
        run: |
          rm -f capacitor.config.ts
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 7. Build Installable Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Rename APK for Easy Download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./HisabPro-TakaFlow-v2.1.apk
          ls -lh ./HisabPro-TakaFlow-v2.1.apk

      - name: 9. Upload Installable APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisabPro-Android-APK
          path: ./HisabPro-TakaFlow-v2.1.apk
          if-no-files-found: error
          retention-days: 30
          
